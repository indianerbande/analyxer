<?xml version="1.0" encoding="UTF-8"?>
<!-- Analyxer – App-Icon. Eigenständige Grafik (kein Android-Roboter / Play-Logo).
     Motiv: gestapelte 3D-Ebenen (Marke der App, APK-Analyse) + Play-Dreieck (Laufzeitbeobachtung).
     Palette aus der App: Akzent-Teal #30CEB8, dunkler Hintergrund #0E1217. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hintergrund des Squircles -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="0.55" stop-color="#11161f"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#30ceb8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#30ceb8" stop-opacity="0"/>
    </radialGradient>
    <!-- Teal-Verläufe für die Ebenen (unten dunkler, oben heller) -->
    <linearGradient id="teal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#128b7d"/>
      <stop offset="1" stop-color="#0d6b61"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fae9b"/>
      <stop offset="1" stop-color="#149b8a"/>
    </linearGradient>
    <linearGradient id="teal3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff0db"/>
      <stop offset="1" stop-color="#2bcdb6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircleClip">
      <path d="M512 110
               C 300 110 196 110 153 153
               C 110 196 110 300 110 512
               C 110 724 110 828 153 871
               C 196 914 300 914 512 914
               C 724 914 828 914 871 871
               C 914 828 914 724 914 512
               C 914 300 914 196 871 153
               C 828 110 724 110 512 110 Z"/>
    </clipPath>
  </defs>

  <!-- Squircle-Körper mit weichem Schatten -->
  <g filter="url(#drop)">
    <path d="M512 110
             C 300 110 196 110 153 153
             C 110 196 110 300 110 512
             C 110 724 110 828 153 871
             C 196 914 300 914 512 914
             C 724 914 828 914 871 871
             C 914 828 914 724 914 512
             C 914 300 914 196 871 153
             C 828 110 724 110 512 110 Z"
          fill="url(#bg)"/>
  </g>

  <g clip-path="url(#squircleClip)">
    <rect x="110" y="110" width="804" height="804" fill="url(#glow)"/>

    <!-- Gestapelte isometrische Ebenen -->
    <g stroke="#0b0f16" stroke-width="10" stroke-linejoin="round">
      <!-- untere Ebene -->
      <path d="M512 612 L744 700 L512 788 L280 700 Z" fill="url(#teal1)"/>
      <!-- mittlere Ebene -->
      <path d="M512 512 L744 600 L512 688 L280 600 Z" fill="url(#teal2)"/>
      <!-- obere Ebene -->
      <path d="M512 412 L744 500 L512 588 L280 500 Z" fill="url(#teal3)"/>
    </g>

    <!-- Play-Dreieck auf der oberen Ebene (dunkler Knockout) -->
    <path d="M470 462 L470 538 L556 500 Z" fill="#0b0f16" opacity="0.92"/>

    <!-- oberer Glanz -->
    <path d="M110 110 H914 V430 C 720 360 304 360 110 430 Z" fill="url(#sheen)"/>
  </g>
</svg>
